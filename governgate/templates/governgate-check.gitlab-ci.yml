# Include only after the engine MR is reviewed, merged and activation checks pass.
# The MR job is a GitLab bridge; it executes no code, forwards no variables, and
# receives no API/Nebius key. The protected controller resolves the source MR
# and exact head SHA from GitLab's upstream pipeline and bridge-job metadata.
governgate-impact:
  stage: .post
  inherit:
    variables: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: false
  trigger:
    project: governgate2/governgate
    branch: main
    strategy: mirror
    forward:
      yaml_variables: false
      pipeline_variables: false
