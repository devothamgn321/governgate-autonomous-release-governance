include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages: [test, verify, review]
variables:
  AST_ENABLE_MR_PIPELINES: "true"
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: python:3.12

unit-tests:
  stage: test
  script:
    - pip install '.[test]' pyyaml
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

trusted-controller:
  stage: verify
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  environment:
    name: governgate-controller
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "pipeline"'
  before_script:
    - apk add --no-cache python3 py3-pip
    - python3 -m venv /tmp/controller-venv
    - /tmp/controller-venv/bin/pip install .
  script:
    - docker build --pull -t governgate-worker -f ci/Dockerfile.worker ci
    - WORKER_IMAGE=$(docker image inspect --format '{{.Id}}' governgate-worker)
    - /tmp/controller-venv/bin/python -m governgate.controller --image "$WORKER_IMAGE"
  timeout: 15m
  allow_failure: false
  artifacts:
    when: always
    paths:
      - governgate-evidence.json
      - governgate-report.md
    expire_in: 90 days

# A passing candidate never merges automatically. The reviewer sees the
# controller's evidence artifacts before starting this credential-free job.
# Failed or incomplete controller runs never reach this stage.
manual-evidence-review:
  stage: review
  image: python:3.12
  needs:
    - job: trusted-controller
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "pipeline"'
      when: manual
      allow_failure: false
  script:
    - python -m governgate.manual_review --evidence governgate-evidence.json

sandbox-smoke:
  stage: test
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache python3 py3-pip
    - python3 -m venv /tmp/smoke-venv
    - /tmp/smoke-venv/bin/pip install .
  script:
    - docker build --pull -t governgate-worker -f ci/Dockerfile.worker ci
    - WORKER_IMAGE=$(docker image inspect --format '{{.Id}}' governgate-worker)
    - /tmp/smoke-venv/bin/python ci/smoke.py "$WORKER_IMAGE"
  timeout: 10m
